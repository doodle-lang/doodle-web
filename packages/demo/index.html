<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No JS eval (§3.9): the Lezer parser is a static table and nothing uses eval/new
         Function. `script-src` stays strict — `wasm-unsafe-eval` only permits WebAssembly
         compilation, not JS eval. `style-src` needs `'unsafe-inline'` because CodeMirror
         injects its editor styles at runtime; styles can't execute code, so this does not
         weaken the script posture. The stricter HTTP-header CSP (+ frame-ancestors) rides
         with the deferred Cloudflare move (Decision #3); this meta is what Pages serves. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
    <title>Doodle</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Doodle</h1>
      <div class="controls">
        <button id="run" type="button">Run ▸</button>
        <button id="debug" type="button">Debug ▸</button>
        <button id="stop" type="button">Stop ◼</button>
        <span id="status" data-kind=""></span>
      </div>
    </header>
    <div id="debug-bar" class="controls" hidden>
      <button id="continue" type="button" title="Continue">▶</button>
      <button id="step" type="button" title="Step">↷</button>
      <button id="into" type="button" title="Step into">⤵</button>
      <button id="over" type="button" title="Step over">⤼</button>
      <button id="out" type="button" title="Step out">⤴</button>
      <label class="toggle"><input id="watch" type="checkbox" /> watch</label>
      <label class="toggle"><input id="trap" type="checkbox" /> trap raises</label>
    </div>
    <main>
      <section class="pane editor-pane">
        <div id="editor"></div>
        <pre id="output" aria-label="output"></pre>
      </section>
      <section class="pane canvas-pane">
        <canvas id="canvas" width="600" height="600"></canvas>
        <div id="debug-panels" hidden aria-label="debugger"></div>
      </section>
    </main>
    <footer>
      <!-- Decision #9 (R8): a single unbounded op (e.g. a huge `**`) can briefly freeze the
           tab; it then hits the heap limit. Documented; the real fix (a mid-computation
           bignum-size cap) is deferred. -->
      A very large single computation (like a huge <code>**</code>) can freeze the page for a
      moment before it stops itself.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
